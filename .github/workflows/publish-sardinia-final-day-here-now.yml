name: Publish Sardinia final-day guide to here.now

on:
  push:
    branches:
      - publish-sardinia-final-day-2026
    paths:
      - ".github/workflows/publish-sardinia-final-day-here-now.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4

      - name: Rebuild HTML
        shell: bash
        run: |
          mkdir -p site
          cat .herenow/sardinia-final-day/chunk1.b64 .herenow/sardinia-final-day/chunk2.b64 .herenow/sardinia-final-day/chunk3.b64 .herenow/sardinia-final-day/chunk4.b64 .herenow/sardinia-final-day/chunk5.b64 | tr -d '\n\r ' | base64 -d > site/index.html
          echo "site_bytes=$(wc -c < site/index.html)"
          test "$(wc -c < site/index.html)" -eq 14039
          echo "sha256=$(sha256sum site/index.html | awk '{print $1}')"
          test "$(sha256sum site/index.html | awk '{print $1}')" = "d351157b6a41c3748bc4289feaeb35fa8069b213eb78fbbd37267ddc1f4b2c92"

      - name: Fetch current here.now publisher
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/heredotnow/skill/main/here-now/scripts/publish.sh -o publish.sh
          chmod +x publish.sh

      - name: Publish anonymous site
        shell: bash
        run: |
          set -o pipefail
          ./publish.sh site --client github-actions 2>&1 | tee publish.log
          echo "=== PUBLISH RESULT ==="
          cat publish.log
