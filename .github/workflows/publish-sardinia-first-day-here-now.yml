name: Publish Sardinia first-day guide to here.now

on:
  push:
    branches:
      - publish-sardinia-first-day-2026
    paths:
      - ".github/workflows/publish-sardinia-first-day-here-now.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4

      - name: Fetch current here.now publisher
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/heredotnow/skill/main/here-now/scripts/publish.sh -o publish.sh
          chmod +x publish.sh

      - name: Publish anonymous site
        shell: bash
        run: |
          set -o pipefail
          ./publish.sh site --client github-actions 2>&1 | tee publish.log
          echo "=== PUBLISH RESULT ==="
          cat publish.log
